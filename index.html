<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monster Garden</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="game-root">
    <canvas id="game" width="960" height="540" aria-label="Monster Garden game"></canvas>
    <section id="hud" aria-live="polite">
      <div class="hud-box">
        <div class="title">MONSTER GARDEN</div>
        <div class="stat-row"><span>HP</span><div class="bar"><div id="hp-fill" class="fill hp"></div></div><span id="hp-text">100 / 100</span></div>
        <div class="stat-row"><span>MP</span><div class="bar"><div id="mp-fill" class="fill mp"></div></div><span id="mp-text">50 / 50</span></div>
        <div class="stat-line"><span>LV <b id="level">1</b></span><span>XP <b id="xp">0 / 100</b></span><span>Gold <b id="gold">100</b></span></div>
        <div class="stat-line"><span>Seeds <b id="seeds">0</b></span><span>Time <b id="time">08:00</b></span></div>
        <div class="stat-line"><span>Foods <b id="foods">0</b></span><span>Traits <b id="power">0</b></span></div>
      </div>
      <div class="hud-box controls">WASD / Arrows: Move | Space: Dodge | J/Z: Attack | K/X: Skill | E: Garden | I: Inventory | 1-3: Skill | Q: Eat | F5/F9: Save/Load</div>
    </section>
    <div id="message"></div>
    <section id="inventory" class="panel hidden" aria-label="Inventory">
      <div class="panel-title">INVENTORY</div>
      <div id="inventory-content"></div>
      <div class="panel-help">I: Close | 1-3: Select Skill | Q: Eat selected food</div>
    </section>
  </main>
  <script src="data.js"></script>
  <script src="world.js"></script>
  <script src="garden.js"></script>
  <script src="inventory.js"></script>
  <script src="save-utils.js"></script>
  <script src="storage.js"></script>
  <script src="systems.js"></script>
  <script src="game.js"></script>
</body>
</html>
